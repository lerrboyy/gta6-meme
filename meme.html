<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    width: 1024px;
    height: 1024px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #1a0b2e 0%, #4a1a6b 30%, #a8327a 55%, #ff6b35 75%, #ffd166 100%);
    font-family: 'Arial Black', Impact, sans-serif;
  }
  .sun {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff3b0, #ffb347 60%, #ff6b35);
    left: 382px;
    top: 300px;
    box-shadow: 0 0 120px 60px rgba(255,180,80,.55);
    z-index: 1;
  }
  .palm-left {
    position: absolute;
    left: 0;
    bottom: 180px;
    width: 260px;
    height: 400px;
    z-index: 2;
  }
  .palm-right {
    position: absolute;
    right: 0;
    bottom: 180px;
    width: 220px;
    height: 380px;
    z-index: 2;
  }
  .city {
    position: absolute;
    bottom: 60px;
    left: 0;
    width: 1024px;
    height: 200px;
    z-index: 3;
  }
  .water {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1024px;
    height: 60px;
    background: #0d1b3e;
    background: linear-gradient(180deg, #142850 0%, #0d1b3e 100%);
    z-index: 4;
  }
  .wasted {
    position: absolute;
    top: 90px;
    width: 1024px;
    text-align: center;
    font-size: 190px;
    letter-spacing: 12px;
    color: #dcdcdc;
    text-shadow: 0 6px 0 #5a5a5a, 0 12px 24px rgba(0,0,0,.6);
    z-index: 5;
    font-family: 'Arial Black', Impact, sans-serif;
  }
  .ghost-container {
    position: absolute;
    width: 300px;
    height: 300px;
    left: 362px;
    top: 330px;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.5));
    z-index: 6;
  }
  .ghost-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .caption {
    position: absolute;
    width: 1024px;
    text-align: center;
    font-family: 'Arial Black', Impact, sans-serif;
    font-weight: bold;
    color: #ffffff;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 10px rgba(0,0,0,.7);
    z-index: 7;
    left: 0;
  }
  .caption-1 {
    top: 690px;
    font-size: 44px;
  }
  .caption-2 {
    top: 748px;
    font-size: 44px;
  }
  .caption-3 {
    top: 806px;
    font-size: 44px;
  }
</style>
</head>
